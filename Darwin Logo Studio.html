/* ==========================================================================
   VEZERLOK FELEPITESE  (egyszer epul fel, utana csak szinkronizalunk)
   onChange(path, value, {commit})   -  ertek valtozott
   onChange(null, null, {action:id}) -  gomb / preset
   ========================================================================== */
const el = (t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };

function fmtVal(row, v){
  if(row.fmt==='%')  return nf(v*100, v*100%1?1:0)+'%';
  if(row.fmt==='em') return nf(v,3)+' em';
  if(row.fmt==='x')  return nf(v,2)+'×';
  return nf(v, (row.step&&row.step<1)?2:0) + (row.unit?'':'');
}
function parseVal(row, s){
  let v=parseFloat(String(s).replace(',','.').replace(/[^0-9.\-]/g,''));
  if(!isFinite(v)) return null;
  if(row.fmt==='%') v=v/100;
  return v;
}

function renderControls(root, schema, state, onChange){
  root.innerHTML='';
  const ctrls=[];

  schema.forEach(sec=>{
    const S=el('div','sec'+(sec.open?' open':''));
    const h=el('h3','', '<span class="ico">'+(sec.ico||'')+'</span>'+sec.title+'<span class="dot"></span><span class="chev"></span>');
    h.addEventListener('click',()=>S.classList.toggle('open'));
    const body=el('div','secbody');
    S.appendChild(h); S.appendChild(body); root.appendChild(S);

    sec.rows.forEach(row=>{
      const node = buildRow(row, state, onChange, ctrls);
      if(node){ body.appendChild(node); }
    });
  });
  root.__ctrls=ctrls;
  return ctrls;
}

function buildRow(row, state, onChange, ctrls){
  const reg=(o)=>{ ctrls.push(o); return o; };

  switch(row.type){
  case 'divider': { const d=el('div','hr'); reg({row,node:d}); return d; }
  case 'note': {
    const d=el('div','note', row.text); reg({row,node:d}); return d; }
  case 'animhint': {
    const d=el('div','note','');
    reg({row,node:d, sync:(s)=>{ const m=ANIM_MODES.find(x=>x.id===s.anim.mode); d.innerHTML=m?('<b>'+m.label+'</b> – '+m.hint):''; }});
    return d; }

  case 'readout': {
    const r=el('div','row'); const l=el('label','',row.label); const v=el('span','ro','–');
    r.appendChild(l); r.appendChild(v);
    reg({row,node:r, sync:(s,meta)=>{ v.textContent=row.get(s,meta); }});
    return r; }

  case 'slider': {
    const r=el('div','row col');
    const top=el('div','row');
    const l=el('label','',row.label);
    const inp=el('input','num'); inp.type='text';
    const u=el('span','unit', row.unit||'');
    top.appendChild(l); top.appendChild(inp); top.appendChild(u);
    const rng=el('input'); rng.type='range'; rng.min=row.min; rng.max=row.max; rng.step=row.step||1;
    r.appendChild(top); r.appendChild(rng);
    l.title='Kattints duplán az alapértékhez';
    l.addEventListener('dblclick',()=>onChange(row.path, getPath(DEFAULTS,row.path), {commit:true}));
    rng.addEventListener('input',()=>onChange(row.path, parseFloat(rng.value), {commit:false}));
    rng.addEventListener('change',()=>onChange(row.path, parseFloat(rng.value), {commit:true}));
    const commitNum=()=>{ const v=parseVal(row, inp.value); if(v!=null) onChange(row.path, clamp(v,row.min,row.max), {commit:true}); };
    inp.addEventListener('change', commitNum);
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ commitNum(); inp.blur(); }
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){
        e.preventDefault();
        const st=(row.step||1)*(e.shiftKey?10:e.altKey?0.1:1)*(e.key==='ArrowUp'?1:-1);
        const cur=getPath(state,row.path)||0;
        onChange(row.path, clamp(+(cur+st).toFixed(6),row.min,row.max), {commit:true});
      }
    });
    reg({row,node:r, sync:(s)=>{ const v=getPath(s,row.path);
      if(document.activeElement!==rng) rng.value=v;
      if(document.activeElement!==inp) inp.value=fmtVal(row,v);
      u.textContent=row.unit||''; }});
    return r; }

  case 'number': {
    const r=el('div','row'); const l=el('label','',row.label);
    const inp=el('input','num'); inp.type='text';
    const u=el('span','unit',row.unit||'');
    r.appendChild(l); r.appendChild(inp); r.appendChild(u);
    const c=()=>{ const v=parseVal(row,inp.value); if(v!=null) onChange(row.path, clamp(v,row.min!=null?row.min:-1e9,row.max!=null?row.max:1e9), {commit:true}); };
    inp.addEventListener('change',c);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){c();inp.blur();} });
    reg({row,node:r, sync:s=>{ if(document.activeElement!==inp) inp.value=nf(getPath(s,row.path),2); }});
    return r; }

  case 'text': {
    const r=el('div','row col'); const l=el('label','',row.label);
    const inp=el('input','txt'); inp.type='text'; if(row.placeholder) inp.placeholder=row.placeholder;
    const top=el('div','row'); top.appendChild(l); r.appendChild(top); r.appendChild(inp);
    inp.addEventListener('input',()=>onChange(row.path, inp.value, {commit:false}));
    inp.addEventListener('change',()=>onChange(row.path, inp.value, {commit:true}));
    reg({row,node:r, sync:s=>{ if(document.activeElement!==inp) inp.value=getPath(s,row.path)||''; }});
    return r; }

  case 'color': {
    const r=el('div','row'); const l=el('label','',row.label);
    const sw=el('div','clr'); const fill=el('span'); const ci=el('input'); ci.type='color';
    sw.appendChild(fill); sw.appendChild(ci);
    const hx=el('input','hex'); hx.type='text';
    r.appendChild(l); r.appendChild(sw); r.appendChild(hx);
    ci.addEventListener('input',()=>onChange(row.path, ci.value.toUpperCase(), {commit:false}));
    ci.addEventListener('change',()=>onChange(row.path, ci.value.toUpperCase(), {commit:true}));
    hx.addEventListener('change',()=>{ const v=hx.value.trim(); if(/^#?[0-9a-fA-F]{3,6}$/.test(v))
      onChange(row.path, rgb2hex.apply(null,hex2rgb(v)), {commit:true}); });
    reg({row,node:r, sync:s=>{ const v=getPath(s,row.path)||'#000000';
      fill.style.background=v; ci.value=/^#[0-9a-f]{6}$/i.test(v)?v:'#000000';
      if(document.activeElement!==hx) hx.value=v; }});
    return r; }

  case 'select': {
    const r=el('div','row col'); const top=el('div','row'); top.appendChild(el('label','',row.label));
    const sel=el('select'); r.appendChild(top); r.appendChild(sel);
    let lastKey='';
    const fill=(s)=>{
      const opts = typeof row.options==='function' ? row.options(s) : row.options;
      const key=opts.map(o=>o.v).join('|');
      if(key!==lastKey){ lastKey=key; sel.innerHTML='';
        opts.forEach(o=>{ const op=el('option','',o.l); op.value=o.v; sel.appendChild(op); }); }
    };
    sel.addEventListener('change',()=>{
      let v=sel.value; const n=parseFloat(v);
      if(!isNaN(n) && String(n)===v) v=n;
      onChange(row.path, v, {commit:true});
    });
    reg({row,node:r, sync:s=>{ fill(s); sel.value=String(getPath(s,row.path)); }});
    return r; }

  case 'segmented': {
    const r=el('div','row'); r.appendChild(el('label','',row.label));
    const g=el('div','seg'); const btns=[];
    (row.options||[]).forEach(o=>{ const b=el('button','',o.l); b.title=o.title||o.l;
      b.addEventListener('click',()=>onChange(row.path,o.v,{commit:true})); g.appendChild(b); btns.push({b,v:o.v}); });
    r.appendChild(g);
    reg({row,node:r, sync:s=>{ const v=getPath(s,row.path);
      btns.forEach(x=>x.b.classList.toggle('on', String(x.v)===String(v))); }});
    return r; }

  case 'toggle': {
    const r=el('div','row'); const l=el('label','',row.label); const b=el('button','sw');
    r.appendChild(l); r.appendChild(b);
    const t=()=>onChange(row.path, !getPath(window.__S,row.path), {commit:true});
    b.addEventListener('click',t); l.addEventListener('click',t);
    reg({row,node:r, sync:s=>{ b.classList.toggle('on', !!getPath(s,row.path)); }});
    return r; }

  case 'font': {
    const r=el('div','row col');
    const top=el('div','row'); top.appendChild(el('label','',row.label));
    const wrap=el('div','row');
    const fs=el('select'); DW_FONTS.forEach(f=>{ const o=el('option','',f.name+(f.g?'':'  (rendszer)')); o.value=f.name; fs.appendChild(o); });
    const ws=el('select'); ws.style.maxWidth='84px'; ws.style.flex='0 0 84px';
    wrap.appendChild(fs); if(row.weightPath) wrap.appendChild(ws);
    r.appendChild(top); r.appendChild(wrap);
    fs.addEventListener('change',()=>{
      onChange(row.path, fs.value, {commit:true});
      if(row.weightPath){
        const cur=getPath(window.__S,row.weightPath);
        onChange(row.weightPath, nearestWeight(fs.value,cur), {commit:true});
      }
    });
    ws.addEventListener('change',()=>onChange(row.weightPath, parseInt(ws.value,10), {commit:true}));
    let lastF='';
    reg({row,node:r, sync:s=>{
      const fn=getPath(s,row.path); fs.value=fn;
      if(row.weightPath){
        if(fn!==lastF){ lastF=fn; ws.innerHTML='';
          fontDef(fn).w.forEach(w=>{ const o=el('option','',String(w)); o.value=w; ws.appendChild(o); }); }
        ws.value=String(getPath(s,row.weightPath));
      }
    }});
    return r; }

  case 'gradient': {
    const r=el('div','row col gwrap');
    r.appendChild(el('div','row','<label>'+row.label+'</label>'));
    const bar=el('div','gbar');
    const meta=el('div','gmeta');
    const sw=el('div','clr'); const fill=el('span'); const ci=el('input'); ci.type='color';
    sw.appendChild(fill); sw.appendChild(ci);
    const hx=el('input','hex'); hx.type='text';
    const pos=el('input','num'); pos.type='text';

function syncControls(root, state, meta){
  const cs=root.__ctrls||[];
  for(const c of cs){
    if(c.row && c.row.when){
      const vis = !!c.row.when(state);
      c.node.classList.toggle('hidden', !vis);
      if(!vis) continue;
    }
    if(c.sync) try{ c.sync(state, meta); }catch(e){}
  }
  // szekciok "modositva" jelzese
  root.querySelectorAll('.sec').forEach((secEl,i)=>{
    const sec=CONTROL_SCHEMA[i]; if(!sec) return;
    let dirty=false;
    (sec.rows||[]).forEach(r=>{
      const ps=[r.path,r.pathX,r.pathY].filter(Boolean);
      ps.forEach(p=>{ if(JSON.stringify(getPath(state,p))!==JSON.stringify(getPath(DEFAULTS,p))) dirty=true; });
    });
    secEl.classList.toggle('touched', dirty);
  });
}

let renderPending=false;
function scheduleRender(){
  if(renderPending) return; renderPending=true;
  requestAnimationFrame(()=>{ renderPending=false; render(); });
}
function render(){
  const S2=S;
  paper.innerHTML='';
  let svg;
  try{ svg = buildSVG(paper, S2, {animT:animT, prefix:'dw'}); }
  catch(err){ console.error(err); toast('Renderelési hiba: '+err.message,'bad',5000); return; }
  lastMeta = svg.__meta||{};
  layoutPaper(S2);
  drawAxisHandles(svg, S2);
  updateSizeStrip(svg);
  updateStatus(S2);
  syncControls(panel, S2, lastMeta);
  $('bUndo').disabled=!HIST.canUndo(); $('bRedo').disabled=!HIST.canRedo();
  $('dims').textContent = (S2.canvas.trim?'trim · ':'')+Math.round(svg.getAttribute('width'))+' × '+Math.round(svg.getAttribute('height'));
  if(window.__syncBg) window.__syncBg();
  updateAnimUI2();
}
function layoutPaper(S2){
  const r=stage.getBoundingClientRect();
  const availW=r.width-60, availH=r.height-112;
  const svg=paper.querySelector('svg'); if(!svg) return;
  const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
  const cw=vb[2]||1, ch=vb[3]||1;
  let sc = Math.min(availW/cw, availH/ch);
  if(!fitZoom) sc = viewZoom; else viewZoom=sc;
  paper.style.width=Math.max(24,cw*sc)+'px';
  paper.style.height=Math.max(24,ch*sc)+'px';
  $('zoomLbl').textContent=Math.round(sc*100)+'%';
  paper.className=S2.canvas.bg;
  if(S2.canvas.bg==='custom') paper.style.setProperty('--paperbg',S2.canvas.bgColor);
}
function updateStatus(S2){
  const lw=(lastMeta&&lastMeta.lineW)||[];
  if(!lw.length){ $('statusRo').textContent=' '; return; }
  $('statusRo').textContent='sorok: '+lw.map(x=>Math.round(x.w)).join(' / ')+' px';
}
function updateSizeStrip(svg){
  const sizes=[16,32,64,128];
  const strip=$('sizeStrip'); strip.innerHTML='';
  const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
  const ar=(vb[2]||1)/(vb[3]||1);
  sizes.forEach(px=>{
    const d=el('div','ss'); const box=el('div','box');
    const w=ar>=1?px:Math.round(px*ar), h=ar>=1?Math.round(px/ar):px;
    box.style.width=w+'px'; box.style.height=h+'px';
    const c=svg.cloneNode(true);
    c.querySelectorAll('#guides').forEach(n=>n.remove());
    c.setAttribute('width',w); c.setAttribute('height',h);
    c.style.width=w+'px'; c.style.height=h+'px';
    box.appendChild(c);
    d.appendChild(box); d.appendChild(el('span','',px+'px'));
    strip.appendChild(d);
  });
}

/* ---------- helix tengely fogantyuk ---------- */
function drawAxisHandles(svg, S2){
  if(!S2.helix.show || !S2.mark.show) return;
  const host = svg.querySelector('#mark_group') || svg.querySelector('#mark_D');
  if(!host) return;
  let g=svg.querySelector('#guides');
  if(!g){ g=mk('g',{id:'guides','pointer-events':'none'}); svg.appendChild(g); }
  const gg=mk('g',{'pointer-events':'auto'});
  g.appendChild(gg);
  const toScreenLocal=(x,y)=>({x,y});
  const ctm = host.getCTM();
  const put=(x,y,which)=>{
    const p=svg.createSVGPoint(); p.x=x; p.y=y;
    const q=ctm?p.matrixTransform(ctm):p;
    const c=mk('circle',{cx:nf(q.x,2),cy:nf(q.y,2),r:14,fill:'rgba(217,166,62,.28)',
      stroke:'#F3D37A','stroke-width':2.5,style:'cursor:grab'});
    c.addEventListener('mousedown',ev=>{
      ev.preventDefault(); ev.stopPropagation();
      const inv=host.getCTM().inverse();
      const move=e2=>{
        const r=svg.getBoundingClientRect();
        const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
        const pt=svg.createSVGPoint();
        pt.x=vb[0]+(e2.clientX-r.left)/r.width*vb[2];
        pt.y=vb[1]+(e2.clientY-r.top)/r.height*vb[3];
        const loc=pt.matrixTransform(inv);
        if(which==='a'){ S.helix.x1=Math.round(loc.x); S.helix.y1=Math.round(loc.y); }
        else           { S.helix.x2=Math.round(loc.x); S.helix.y2=Math.round(loc.y); }
        scheduleRender();
      };
      const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
        commitHistory('helix tengely'); };
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
    gg.appendChild(c);
  };
  const l=mk('line',{}); gg.appendChild(l);
  const p1=svg.createSVGPoint(); p1.x=S2.helix.x1; p1.y=S2.helix.y1;
  const p2=svg.createSVGPoint(); p2.x=S2.helix.x2; p2.y=S2.helix.y2;
  const q1=ctm?p1.matrixTransform(ctm):p1, q2=ctm?p2.matrixTransform(ctm):p2;
  l.setAttribute('x1',nf(q1.x,2)); l.setAttribute('y1',nf(q1.y,2));
  l.setAttribute('x2',nf(q2.x,2)); l.setAttribute('y2',nf(q2.y,2));
  l.setAttribute('stroke','rgba(243,211,122,.5)'); l.setAttribute('stroke-width',1.5);
  l.setAttribute('stroke-dasharray','7 6');
  put(S2.helix.x1,S2.helix.y1,'a'); put(S2.helix.x2,S2.helix.y2,'b');
}

/* ==========================================================================
   ALLAPOT VALTOZTATAS
   ========================================================================== */
function commitHistory(label){ HIST.push(S,label); }
function onChange(path, value, o){
  o=o||{};
  if(o.action){ doAction(o.action, o.id); return; }
  if(path==null) return;
  setPath(S, path, value);
  if(o.commit) HIST.push(S, path);
  scheduleRender();
  if(path.indexOf('.font')>0 || path.indexOf('.weight')>0) ensureFonts();
}
function applyState(next, label){
  S = migrate(next); window.__S = S;
  if(label!==false) HIST.push(S, label||'állapot');
  ensureFonts().then(scheduleRender);
  scheduleRender();
}
function applyPatch(patch, label){
  applyState(deepMerge(S, patch), label);
}
function ensureFonts(){
  return Promise.all(fontsInUse(S).map(f=>loadFont(f.name, f.weights)))
    .then(()=>{ clearFitCache(); scheduleRender(); });
}

/* ==========================================================================
   MUVELETEK
   ========================================================================== */
function doAction(a, id){
  switch(a){
  case 'preset': {
    const p=DW_PRESETS.find(x=>x.id===id); if(!p) return;
    const patch=deepClone(p.patch);
    /* az "app ikon" preset szandekosan elrejti a szovegeket - minden mas preset
       visszakapcsolja oket, kulonben egy korabbi preset hatasa "beragadna" */
    if(p.id!=='ikon') ['mark','word','tag','svc'].forEach(k=>{
      patch[k]=patch[k]||{}; if(patch[k].show===undefined) patch[k].show=true; });
    applyPatch(patch, 'preset: '+p.label); toast('Preset: '+p.label,'ok'); return; }
  case 'gold': {
    const p=GOLD_PRESETS.find(x=>x.id===id); if(!p) return;
    applyPatch({gold:{stops:deepClone(p.stops)}}, 'arany: '+p.label); return; }
  case 'resetAll':
    modal('Mindent alaphelyzetbe?','<div class="note">Az aktuális beállítások elvesznek. A mentett verziók megmaradnak.</div>',
      [{label:'Mégsem'},{label:'Alaphelyzet',kind:'pri',fn:()=>{ applyState(deepClone(DEFAULTS),'alaphelyzet'); toast('Alaphelyzet','ok'); }}]);
    return;
  case 'sq1254': applyPatch({canvas:{w:1254,h:1254}},'vászon'); return;
  case 'sq1200': applyPatch({canvas:{w:1200,h:1200}},'vászon'); return;
  case 'sq1024': applyPatch({canvas:{w:1024,h:1024}},'vászon'); return;
  case 'og':     applyPatch({canvas:{w:1200,h:630}},'vászon'); return;
  case 'wide':   applyPatch({canvas:{w:1920,h:1080}},'vászon'); return;
  case 'card':   applyPatch({canvas:{w:1800,h:700}},'vászon'); return;
  case 'sqLock': { const v=Math.round((S.inner.w+S.inner.h)/2); applyPatch({inner:{w:v,h:v}},'négyzetesítés'); return; }
  case 'sqCenter': {
    /* optikai kozep: a belso forma a D tomegenek kozepere kerul */
    const m=S.mark, i=S.inner;
    const rightMass = m.width - (m.stem + i.w);
    const dx = Math.round((rightMass - m.stem)/2);
    const bottom = m.height - m.topBar - i.h;
    const dy = Math.round((bottom - m.topBar)/2);
    applyPatch({inner:{offsetX:dx, offsetY:dy}},'optikai közép');
    toast('Belső forma optikailag középre igazítva','ok'); return; }
  case 'hxReset': applyPatch({helix:{x1:-161,y1:583,x2:782,y2:135}},'helix tengely'); return;
  case 'hxMirror': applyPatch({helix:{x1:S.mark.width-S.helix.x1, y1:S.helix.y1,
                                      x2:S.mark.width-S.helix.x2, y2:S.helix.y2}},'helix tükrözés'); return;
  case 'hxFlat': { const cy=S.mark.height/2;
    applyPatch({helix:{y1:cy,y2:cy,x1:-S.mark.width*0.3,x2:S.mark.width*1.25}},'helix vízszintes'); return; }
  case 'sep-': case 'sep•': case 'sep|': case 'sep/': {
    const ch=a.slice(3);
    const t=S.svc.text.replace(/\s*[-–—•|\/]\s*/g,' '+ch+' ');
    applyPatch({svc:{text:t}},'elválasztó'); return; }
  case 'expSVG':    exportSVG(false); return;
  case 'expSVGEmb': exportSVG(true); return;
  case 'expPNG1':   exportPNG(1); return;
  case 'expPNG2':   exportPNG(2); return;
  case 'expPNG4':   exportPNG(4); return;
  case 'expPNG8':   exportPNG(8); return;
  case 'expBoth':   exportBoth(); return;
  case 'expPack':   exportPack(); return;
  case 'copySVG':   copySVG(); return;
  case 'expJSON':   downloadText(fileBase()+'.json', JSON.stringify({app:'darwin-logo-studio',appVersion:APP_VERSION,state:S},null,2),'application/json'); toast('JSON mentve','ok'); return;
  case 'expAnimSVG':exportAnimSVG(); return;
  case 'expWebM':   exportWebM(); return;
  case 'expFrames': exportFrames(); return;
  }
}
function fileBase(){
  const n=(S.meta.name||'darwinai-logo').toLowerCase()
    .replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i')
    .replace(/[óöő]/g,'o').replace(/[úüű]/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return (n||'darwinai-logo')+(S.helix.show?'-helix':'-clean');
}

/* ---------- export segedek ---------- */
function buildForExport(state, animTime){
  const holder=el('div'); measure.appendChild(holder);
  const svg=buildSVG(holder, state, {forExport:true, animT:animTime||0, bakeBG:true, prefix:'dw'});
  const txt=optimizeSVG(serializeSVG(svg),2);
  holder.remove();
  return txt;
}
async function withFonts(svgText, state){
  const css=await fetchEmbeddedFontCSS(fontsInUse(state), charsInUse(state));
  if(!css) return {text:svgText, ok:false};
  return {text:injectStyle(svgText, css), ok:true};
}
function exportSVG(embed){
  const txt=buildForExport(S, animT);
  if(!embed){ downloadText(fileBase()+'.svg', txt, 'image/svg+xml'); toast('SVG mentve (élő szöveg)','ok'); return; }
  toast('Betűtípusok beágyazása…');
  withFonts(txt,S).then(r=>{
    downloadText(fileBase()+'-embedded.svg', r.text, 'image/svg+xml');
    toast(r.ok?'SVG mentve beágyazott fonttal':'SVG mentve – a font beágyazása nem sikerült (offline?)', r.ok?'ok':'warn', 4000);
  });
}
async function exportPNG(mult){

    toast('PNG készítése…');
    const txt=buildForExport(S, animT);

    const svg=paper.querySelector('svg');

  }catch(e){ toast('PNG hiba: '+e.message,'bad',5000); }
}
function exportBoth(){
  const a=deepMerge(S,{helix:{show:false}});
  const b=deepMerge(S,{helix:{show:true}});
  downloadText('darwinai-logo-clean.svg', buildForExport(a,0), 'image/svg+xml');
  setTimeout(()=>downloadText('darwinai-logo-helix.svg', buildForExport(b,0), 'image/svg+xml'), 350);

}
async function exportPack(){
  const sizes=[1024,512,256,128,64,32,16];
  try{
    const txt=buildForExport(deepMerge(S,{canvas:{trim:false}}), 0);
    const r=await withFonts(txt,S);
    const svg=paper.querySelector('svg');
    const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
    const ar=vb[2]/vb[3];
    for(const s of sizes){
      const blob=await rasterize(r.text, ar>=1?s:s*ar, ar>=1?s/ar:s, null);
      downloadBlob(fileBase()+'-'+s+'.png', blob);
      await new Promise(r2=>setTimeout(r2,260));
    }
    toast('Ikoncsomag mentve ('+sizes.length+' PNG)','ok');
  }catch(e){ toast('Hiba: '+e.message,'bad',5000); }
}
function copySVG(){
  copyToClipboard(buildForExport(S,animT))
    .then(()=>toast('SVG a vágólapon','ok'))
    .catch(()=>toast('A vágólapra másolás nem sikerült','bad'));
}
/* ---------- animalt export ---------- */
function exportAnimSVG(){
  if(S.anim.mode==='none'){ toast('Előbb válassz animációs módot.','warn'); return; }
  const N=clamp(Math.round(S.anim.frames),4,90);
  const dur=S.anim.duration/Math.max(.05,S.anim.speed);
  const holder=el('div'); measure.appendChild(holder);
  let inner='', vb='', w=0,h=0;
  for(let i=0;i<N;i++){
    const svg=buildSVG(holder, S, {forExport:true, animT:i/N, bakeBG:false, prefix:'f'+i});
    if(!i){ vb=svg.getAttribute('viewBox'); w=svg.getAttribute('width'); h=svg.getAttribute('height'); }
    let body='';
    Array.from(svg.childNodes).forEach(n=>{
      if(n.nodeName==='title') return;
      body += new XMLSerializer().serializeToString(n);
    });
    inner += '<g class="dwf" style="animation-delay:'+nf(-i*dur/N,3)+'s">'+body+'</g>';
    holder.innerHTML='';
  }
  holder.remove();
  const css='.dwf{visibility:hidden;animation:dwflip '+nf(dur,3)+'s steps(1,end) infinite}'
    +'@keyframes dwflip{0%{visibility:visible}'+nf(100/N,4)+'%,100%{visibility:hidden}}';
  const out='<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="'+SVGNS+'" viewBox="'+vb+'" width="'+w+'" height="'+h+'">'
    +'<style type="text/css"><![CDATA['+css+']]></style>'+inner+'</svg>';
  downloadText(fileBase()+'-animated.svg', optimizeSVG(out,2), 'image/svg+xml');
  toast('Animált SVG mentve · '+N+' képkocka','ok',4000);
}
async function exportFrames(){
  if(S.anim.mode==='none'){ toast('Előbb válassz animációs módot.','warn'); return; }
  const N=clamp(Math.round(S.anim.frames),4,90);
  const svg0=paper.querySelector('svg');
  const vb=(svg0.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
  toast('Képkockák renderelése ('+N+' db)…');
  try{
    const css=await fetchEmbeddedFontCSS(fontsInUse(S), charsInUse(S));
    for(let i=0;i<N;i++){
      const txt=injectStyle(buildForExport(S, i/N), css);
      const blob=await rasterize(txt, vb[2], vb[3], null);
      downloadBlob(fileBase()+'-f'+String(i).padStart(3,'0')+'.png', blob);
      await new Promise(r=>setTimeout(r,180));
    }
    toast('Kész: '+N+' PNG képkocka','ok');
  }catch(e){ toast('Hiba: '+e.message,'bad',5000); }
}
async function exportWebM(){
  if(S.anim.mode==='none'){ toast('Előbb válassz animációs módot.','warn'); return; }
  if(typeof MediaRecorder==='undefined'){ toast('Ez a böngésző nem támogatja a videórögzítést.','bad'); return; }
  const svg0=paper.querySelector('svg');
  const vb=(svg0.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
  const W=Math.min(1600,Math.round(vb[2])), H=Math.round(W*vb[3]/vb[2]);
  const fps=25, secs=S.anim.duration/Math.max(.05,S.anim.speed), total=Math.round(fps*secs);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  let mime='video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm;codecs=vp8';
  if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
  const stream=cv.captureStream(fps);
  const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:8_000_000});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(res=>{ rec.onstop=()=>res(new Blob(chunks,{type:'video/webm'})); });
  toast('Videó rögzítése… ('+total+' kocka)');
  const css=await fetchEmbeddedFontCSS(fontsInUse(S), charsInUse(S));
  rec.start();
  try{
    for(let i=0;i<total;i++){
      const txt=injectStyle(buildForExport(S, i/total), css);
      const blob=await rasterize(txt, W, H, S.canvas.bg==='checker'?'#FFFFFF':null);
      const img=await new Promise((res,rej)=>{ const u=URL.createObjectURL(blob); const im=new Image();
        im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=rej; im.src=u; });
      cx.clearRect(0,0,W,H); cx.drawImage(img,0,0,W,H);
      await new Promise(r=>setTimeout(r, 1000/fps));
    }
  }catch(e){ toast('Rögzítési hiba: '+e.message,'bad',5000); }
  rec.stop();
  const blob=await done;
  downloadBlob(fileBase()+'.webm', blob);
  toast('WebM videó mentve','ok');
}

/* ==========================================================================
   VERZIOK
   ========================================================================== */
function thumbOf(){
  try{
    const svg=paper.querySelector('svg'); if(!svg) return '';
    const c=svg.cloneNode(true); c.querySelectorAll('#guides').forEach(n=>n.remove());
    c.setAttribute('width',120); c.setAttribute('height',120);
    const t=new XMLSerializer().serializeToString(c);
    return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(t)));
  }catch(e){ return ''; }
}
function saveVersion(){
  const now=new Date();
  const dflt=(S.meta.name||'Darwin AI')+' · '+now.toLocaleDateString('hu-HU')+' '+now.toTimeString().slice(0,5);
  modal('Verzió mentése',
    '<div><label class="fl">Név</label><input class="txt" id="mvName" value="'+esc(dflt)+'"></div>'+
    '<div><label class="fl">Megjegyzés – mi változott, mire jó?</label><textarea id="mvNote" rows="4" placeholder="pl. vastagabb szár, kisebb négyzet, ügyfélnek küldve"></textarea></div>'+
    '<div><label class="fl">Címkék (vesszővel)</label><input class="txt" id="mvTags" placeholder="ügyfél, v2, sötét háttér"></div>',
    [{label:'Mégsem'},{label:'Mentés',kind:'pri',fn:m=>{
      const v=STORE.save(S,{ name:m.querySelector('#mvName').value.trim()||'Verzió',
        note:m.querySelector('#mvNote').value,
        tags:m.querySelector('#mvTags').value.split(',').map(x=>x.trim()).filter(Boolean),
        thumb:thumbOf() });
      curVersionId=v.id; renderRail();
      toast(STORE.persistent?'Verzió mentve':'Mentve (csak memóriában – '+STORE.lastError+')', STORE.persistent?'ok':'warn',4000);
    }}]);
}
function renderRail(){
  const q=($('vSearch').value||'').toLowerCase();
  const list=STORE.list().filter(v=> !q ||
    (v.name+' '+v.note+' '+(v.tags||[]).join(' ')).toLowerCase().indexOf(q)>=0);
  const box=$('vlist'); box.innerHTML='';
  $('vcount').textContent=STORE.list().length;
  $('vbytes').textContent=Math.round(STORE.usageBytes()/1024)+' kB';
  $('vpersist').textContent=STORE.persistent?'localStorage':'csak memória';
  $('vpersist').style.color=STORE.persistent?'':'var(--warn)';
  if(!list.length){ box.appendChild(el('div','empty', q?'Nincs találat.':'Még nincs mentett verzió.<br>Nyomd meg a <b>★ Mentés</b> gombot,<br>és írj hozzá megjegyzést.')); return; }
  list.forEach(v=>{
    const c=el('div','vcard'+(v.id===curVersionId?' cur':'')+(v.pinned?' pinned':''));
    const th=el('div','th'); if(v.thumb){ const i=el('img'); i.src=v.thumb; th.appendChild(i); }
    const info=el('div','vi');
    info.appendChild(el('div','vn', esc(v.name)));
    info.appendChild(el('div','vd', new Date(v.updatedAt).toLocaleString('hu-HU')));
    if(v.note) info.appendChild(el('div','vnote', esc(v.note)));
    if(v.tags&&v.tags.length){ const tg=el('div','vtags'); v.tags.forEach(t=>tg.appendChild(el('span','vtag',esc(t)))); info.appendChild(tg); }
    const acts=el('div','vacts');
    const ab=(t,title,fn,cls)=>{ const b=el('button','iact '+(cls||''),t); b.title=title;
      b.addEventListener('click',e=>{e.stopPropagation();fn();}); acts.appendChild(b); };
    ab('&#9733;','Rögzítés',()=>{STORE.togglePin(v.id);renderRail();},'pin');
    ab('&#9998;','Átnevezés / megjegyzés',()=>editVersion(v.id));
    ab('&#10697;','Másolat',()=>{STORE.duplicate(v.id);renderRail();toast('Másolat készült','ok');});
    ab('&#10005;','Törlés',()=>{
      modal('Verzió törlése','<div class="note">„'+esc(v.name)+'” véglegesen törlődik.</div>',
        [{label:'Mégsem'},{label:'Törlés',kind:'danger',fn:()=>{STORE.remove(v.id);renderRail();toast('Törölve');}}]);
    });
    c.appendChild(th); c.appendChild(info); c.appendChild(acts);
    c.addEventListener('click',()=>{
      applyState(deepClone(v.state),'betöltés: '+v.name);
      curVersionId=v.id; renderRail(); toast('Betöltve: '+v.name,'ok');
    });
    box.appendChild(c);
  });
}
function editVersion(id){
  const v=STORE.get(id); if(!v) return;
  modal('Verzió szerkesztése',
    '<div><label class="fl">Név</label><input class="txt" id="evName" value="'+esc(v.name)+'"></div>'+
    '<div><label class="fl">Megjegyzés</label><textarea id="evNote" rows="5">'+esc(v.note)+'</textarea></div>'+
    '<div><label class="fl">Címkék</label><input class="txt" id="evTags" value="'+esc((v.tags||[]).join(', '))+'"></div>',
    [{label:'Mégsem'},{label:'Mentés',kind:'pri',fn:m=>{
      STORE.update(id,{name:m.querySelector('#evName').value.trim()||v.name,
        note:m.querySelector('#evNote').value,
        tags:m.querySelector('#evTags').value.split(',').map(x=>x.trim()).filter(Boolean)});
      renderRail(); toast('Frissítve','ok');
    }}]);
}
function compareVersions(){
  const list=STORE.list();
  if(!list.length){ toast('Nincs mentett verzió.','warn'); return; }
  const opts=list.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join('');
  modal('Összevetés az aktuális beállítással',
    '<div><label class="fl">Melyik verzióval?</label><select id="cmpSel">'+opts+'</select></div>'+
    '<div id="cmpOut" class="note">…</div>',
    [{label:'Bezár'}],
    m=>{
      const run=()=>{
        const v=STORE.get(m.querySelector('#cmpSel').value); if(!v) return;
        const d=stateDiff(migrate(v.state), S);
        const out=m.querySelector('#cmpOut');
        if(!d.length){ out.innerHTML='<b>Nincs eltérés.</b>'; return; }
        out.innerHTML='<table class="difftbl"><tbody>'+d.map(x=>
          '<tr><td>'+esc(x.path)+'</td><td class="from">'+esc(JSON.stringify(x.from))+'</td>'+
          '<td class="to">'+esc(JSON.stringify(x.to))+'</td></tr>').join('')+'</tbody></table>'+
          '<div style="margin-top:8px">'+d.length+' eltérés</div>';
      };
      m.querySelector('#cmpSel').addEventListener('change',run); run();
    });
}

/* ==========================================================================
   ANIMACIO
   ========================================================================== */
function animLoop(ts){
  animRAF=requestAnimationFrame(animLoop);
  if(S.anim.mode==='none' || !S.anim.playing || scrubbing) return;
  if(!animStart) animStart=ts;
  const dur=Math.max(0.05,S.anim.duration)/Math.max(0.05,S.anim.speed)*1000;
  animT=((ts-animStart)%dur)/dur;
  $('scrub').value=Math.round(animT*1000);
  $('tlabel').textContent=nf(animT*dur/1000,2)+' / '+nf(dur/1000,2)+' s';
  render();
}
function updateAnimUI(){
  const on=S.anim.mode!=='none';
  $('scrubWrap').classList.toggle('hidden',!on);
  $('bPlay').innerHTML=S.anim.playing?'&#10074;&#10074;':'&#9654;';
  if(!on){ animT=0; animStart=0; }
}

/* ==========================================================================
   ESEMENYEK / INDULAS
   ========================================================================== */
function wire(){
  $('bUndo').addEventListener('click',()=>{ const s=HIST.undo(); if(s){ S=s; window.__S=S; ensureFonts(); scheduleRender(); } });
  $('bRedo').addEventListener('click',()=>{ const s=HIST.redo(); if(s){ S=s; window.__S=S; ensureFonts(); scheduleRender(); } });
  $('bSave').addEventListener('click',saveVersion);
  $('bExport').addEventListener('click',()=>{
    document.querySelectorAll('#panel .sec').forEach(s=>s.classList.remove('open'));
    const ix=CONTROL_SCHEMA.findIndex(x=>x.id==='export');
    const secs=document.querySelectorAll('#panel .sec');
    if(secs[ix]){ secs[ix].classList.add('open'); secs[ix].scrollIntoView({behavior:'smooth',block:'start'}); }
  });
  $('bTheme').addEventListener('click',()=>{
    const h=document.documentElement;
    h.dataset.theme = h.dataset.theme==='dark'?'light':'dark';
    try{ localStorage.setItem('dw-theme',h.dataset.theme); }catch(e){}
  });
  $('bRail').addEventListener('click',()=>$('rail').classList.toggle('on'));
  $('bVarSimple').addEventListener('click',()=>doAction('preset','simple'));
  $('bVarCross').addEventListener('click',()=>doAction('preset','cross'));
  $('vSearch').addEventListener('input',renderRail);
  $('bVCompare').addEventListener('click',compareVersions);
  $('bVExport').addEventListener('click',()=>{
    downloadText('darwin-logo-verziok.json', STORE.exportAll(), 'application/json');
    toast('Verziók exportálva','ok');
  });
  $('bVImport').addEventListener('click',()=>$('fileIn').click());
  $('fileIn').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ handleImport(String(r.result), f.name); $('fileIn').value=''; };
    r.readAsText(f);
  });

  /* zoom */
  $('zIn').addEventListener('click',()=>{ fitZoom=false; viewZoom=clamp(viewZoom*1.2,0.02,12); layoutPaper(S); });
  $('zOut').addEventListener('click',()=>{ fitZoom=false; viewZoom=clamp(viewZoom/1.2,0.02,12); layoutPaper(S); });
  $('zFit').addEventListener('click',()=>{ fitZoom=true; layoutPaper(S); });
  window.addEventListener('resize',()=>layoutPaper(S));

  /* hatter gombok */
  const bgs=[['checker','Átlátszó'],['white','Fehér'],['black','Fekete'],['brand','Brand'],['custom','Egyéni']];
  const bp=$('bgPills');
  bgs.forEach(([v,l])=>{ const b=el('button','',l);
    b.addEventListener('click',()=>onChange('canvas.bg',v,{commit:true}));
    b.dataset.v=v; bp.appendChild(b); });
  window.__syncBg=()=>bp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.canvas.bg));

  /* animacio */
  $('bPlay').addEventListener('click',()=>{ onChange('anim.playing',!S.anim.playing,{commit:true});
    animStart=0; updateAnimUI(); });
  $('scrub').addEventListener('mousedown',()=>scrubbing=true);
  document.addEventListener('mouseup',()=>{ if(scrubbing){ scrubbing=false; animStart=0; } });
  $('scrub').addEventListener('input',()=>{
    animT=parseFloat($('scrub').value)/1000;
    const dur=Math.max(0.05,S.anim.duration)/Math.max(0.05,S.anim.speed);
    $('tlabel').textContent=nf(animT*dur,2)+' / '+nf(dur,2)+' s';
    render();
  });

  /* billentyuk */
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    const typing = tag==='input'||tag==='textarea'||tag==='select';
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault();
      const s=e.shiftKey?HIST.redo():HIST.undo(); if(s){S=s;window.__S=S;ensureFonts();scheduleRender();} return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault();
      const s=HIST.redo(); if(s){S=s;window.__S=S;ensureFonts();scheduleRender();} return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveVersion(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){ e.preventDefault(); exportSVG(false); return; }
    if(e.key==='Escape'){ closeModal(); return; }
    if(typing) return;
    if(e.key===' '){ e.preventDefault(); if(S.anim.mode!=='none'){ onChange('anim.playing',!S.anim.playing,{commit:false}); animStart=0; updateAnimUI(); } }
    if(e.key==='h'||e.key==='H'){ onChange('helix.show',!S.helix.show,{commit:true}); }
    if(e.key==='g'||e.key==='G'){ onChange('guides.grid',!S.guides.grid,{commit:true}); }
    if(e.key==='b'||e.key==='B'){ onChange('guides.bbox',!S.guides.bbox,{commit:true}); }
  });

  /* fajl behuzas */
  ['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('drag');}));
  ['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('drag');}));
  stage.addEventListener('drop',e=>{
    const f=e.dataTransfer.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>handleImport(String(r.result), f.name); r.readAsText(f);
  });
}
function handleImport(text, name){
  try{
    const d=JSON.parse(text);
    if(d && d.state){ applyState(d.state,'import: '+name); toast('Beállítás betöltve','ok'); return; }
    const n=STORE.importAll(text,true); renderRail(); toast(n+' verzió importálva','ok'); return;
  }catch(e){ toast('Nem sikerült beolvasni: '+e.message,'bad',5000); }
}

/* ---------- indulas ---------- */
function boot(){
  try{ const t=localStorage.getItem('dw-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  renderControls(panel, CONTROL_SCHEMA, S, onChange);
  wire();
  HIST.reset(S);
  renderRail();
  updateAnimUI();
  render();
  ensureFonts().then(()=>{ clearFitCache(); render(); layoutPaper(S); });
  animRAF=requestAnimationFrame(animLoop);
  if(!STORE.persistent) toast(STORE.lastError,'warn',6000);
}
let _lastAnimMode=null, _lastPlaying=null;
function updateAnimUI2(){
  if(S.anim.mode!==_lastAnimMode || S.anim.playing!==_lastPlaying){
    _lastAnimMode=S.anim.mode; _lastPlaying=S.anim.playing; animStart=0; updateAnimUI();
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
