<!--
  Darwin AI – alap (helix nélküli) logó
  A Simple.png pixelpontos kimérése alapján készült vektoros mása.
  Vászon 1254×1254, átlátszó háttér. A D belső négyzete valódi knockout (fill-rule="evenodd").
  A szövegek élő <text> elemek – véglegesítéskor alakítsd görbévé (Illustrator / Figma),
  vagy exportálj beágyazott fonttal a Darwin Logo Studio-ból.
  Betűk: Archivo Black (wordmark), Montserrat 500 (tagline), Poppins 600 (szolgáltatás sor).
-->
